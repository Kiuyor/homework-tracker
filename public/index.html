<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>作业墙</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 顶部一行 -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">作业</div>
      <div class="date-nav" id="dateNav">
        <button class="date-btn" id="prevDate" title="前一天">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="date-display" id="dateDisplay">
          <span id="dateLabel"></span>
        </div>
        <button class="date-btn" id="nextDate" title="后一天">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="today-btn" id="todayBtn">今天</button>
      </div>
      <div class="top-actions">
        <button class="mode-toggle" id="modeToggle">展示</button>
        <button class="add-btn" id="addBtn">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加作业
        </button>
        <button class="collapse-btn" id="collapseBtn" title="收起顶栏">
          <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 顶栏收起后的展开按钮 -->
  <button class="expand-bar hidden" id="expandBtn" title="展开顶栏">
    <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    显示顶栏
  </button>

  <!-- 编辑模式扩展条（编辑模式常驻显示） -->
  <div class="manage-bar" id="manageBar">
    <div class="manage-group">
      <button class="tool-btn" id="batchEditBtn">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        批量编辑
      </button>
      <button class="tool-btn" id="batchImportBtn">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        批量导入
      </button>
    </div>
    <div class="manage-divider"></div>
    <div class="filter-wrap">
      <select class="subject-filter" id="subjectFilter" title="按科目筛选">
        <option value="">全部科目</option>
      </select>
    </div>
    <div class="manage-divider"></div>
    <div class="font-wrap">
      <span class="fs-label">字号</span>
      <input type="range" id="fontSizeSlider" min="18" max="88" value="44" step="1" title="字号">
      <span id="fontSizeLabel">44px</span>
    </div>
    <div class="manage-divider"></div>
    <button class="tool-btn icon-only" id="darkmodeBtn" title="暗色模式">
      <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <!-- 主体：科目分组 -->
  <main class="main">
    <div class="subject-groups" id="subjectGroups"></div>
  </main>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">添加作业</h2>
        <button class="modal-close" id="modalClose" title="关闭">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="homeworkForm">
        <input type="hidden" id="editId" value="">
        <div class="form-group">
          <label for="subjectSelect">科目</label>
          <select id="subjectSelect">
            <option value="">请选择科目</option>
          </select>
        </div>
        <div class="form-group">
          <label for="contentInput">作业内容</label>
          <textarea id="contentInput" rows="3" placeholder="写作业内容..." required></textarea>
        </div>
        <div class="form-group">
          <label for="deadlineInput">截止时间</label>
          <input type="text" id="deadlineInput" placeholder="如 14:30（可留空）">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="modalCancel">取消</button>
          <button type="submit" class="btn-submit" id="modalSubmit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Batch Import Modal -->
  <div class="modal-overlay hidden" id="batchModalOverlay">
    <div class="modal batch-modal">
      <div class="modal-header">
        <h2>批量导入作业</h2>
        <button class="modal-close" id="batchModalClose" title="关闭">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="form-group" style="padding: var(--space-lg);">
        <label>每行一条：科目：内容</label>
        <textarea id="batchInput" rows="10" placeholder="语文：背诵第三课
数学：练习册 P45-48
英语：Unit 5 单词抄写"></textarea>
      </div>
      <div class="form-actions" style="padding: 0 var(--space-lg) var(--space-lg);">
        <button type="button" class="btn-cancel" id="batchCancel">取消</button>
        <button type="button" class="btn-submit" id="batchSubmit">导入</button>
      </div>
    </div>
  </div>

  <!-- 批量编辑栏 -->
  <div class="batch-bar hidden" id="batchBar">
    <span class="batch-count" id="batchCount">已选 0 条</span>
    <select id="batchSubjectSelect" title="批量修改科目">
      <option value="">科目不变</option>
    </select>
    <input type="text" id="batchNoteInput" placeholder="批量备注（留空则不变）">
    <button class="btn-cancel" id="batchCancelBtn">退出</button>
    <button class="btn-submit" id="batchApplyBtn">应用</button>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 展示模式控制（右下角：字号调节 + 退出） -->
  <div class="show-ctrl hidden" id="showCtrl">
    <div class="show-font" id="showFontCtrl">
      <button id="showFontMinus" title="缩小字号"><span>A−</span></button>
      <span class="show-font-val" id="showFontVal">100%</span>
      <button id="showFontPlus" title="放大字号"><span>A+</span></button>
    </div>
    <button id="exitShowBtn" class="exit-show-btn" title="退出展示模式">
      <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>
  </div>

  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
