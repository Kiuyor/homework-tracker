<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>作业墙</title>

  <!-- 刻意不引外部网络字体：绿色版承诺「无需联网」，而 Google Fonts 在国内教室
       通常卡到超时，作为渲染阻塞资源会把首屏白屏拖长好几秒。
       改用 style.css 里的系统字体回退链（PingFang SC / Microsoft YaHei / system-ui），
       Windows 教室一定有微软雅黑；展示模式字号由 fitShowDisplay() 运行时测量，会自动适配。 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 顶部一行 -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">作业</div>
      <div class="date-nav" id="dateNav">
        <button class="date-btn" id="prevDate" title="前一天">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="date-display" id="dateDisplay">
          <span id="dateLabel"></span>
        </div>
        <button class="date-btn" id="nextDate" title="后一天">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="today-btn" id="todayBtn">今天</button>
      </div>
      <div class="top-actions">
        <button class="mode-toggle" id="modeToggle">展示</button>
        <button class="add-btn" id="addBtn">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          添加作业
        </button>
        <button class="collapse-btn" id="collapseBtn" title="收起顶栏">
          <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 顶栏收起后的展开按钮 -->
  <button class="expand-bar hidden" id="expandBtn" title="展开顶栏">
    <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    显示顶栏
  </button>

  <!-- 编辑模式扩展条（编辑模式常驻显示） -->
  <div class="manage-bar" id="manageBar">
    <div class="filter-wrap">
      <select class="subject-filter" id="subjectFilter" title="按科目筛选">
        <option value="">全部科目</option>
      </select>
    </div>
    <div class="manage-divider"></div>
    <div class="font-wrap">
      <span class="fs-label">字号</span>
      <input type="range" id="fontSizeSlider" min="18" max="88" value="44" step="1" title="字号">
      <span id="fontSizeLabel">44px</span>
    </div>
    <div class="manage-divider"></div>
    <button class="tool-btn icon-only" id="darkmodeBtn" title="暗色模式">
      <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <!-- 主体：科目分组 -->
  <main class="main">
    <div class="subject-groups" id="subjectGroups"></div>
  </main>

  <!-- Add / Edit Modal -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">添加作业</h2>
        <button class="modal-close" id="modalClose" title="关闭">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="homeworkForm">
        <input type="hidden" id="editId" value="">
        <!-- .form-body 是模态里唯一的滚动区：软键盘弹起时模态整体变矮，
             字段区滚动，而下方「取消/保存」始终留在模态底部（故事 18） -->
        <div class="form-body">
          <div class="form-group">
            <label for="subjectInput">科目</label>
            <!-- 开放集：下拉里选已有的，或直接敲新名（保存时自动建科）。
                 原来这里是 <select>，全站没有增删科目入口，政治/历史/地理无处可录。 -->
            <input type="text" id="subjectInput" list="subjectOptions" maxlength="50"
                   autocomplete="off" placeholder="选择或输入科目，如 政治">
            <datalist id="subjectOptions"></datalist>
          </div>
          <div class="form-group">
            <label for="contentInput">作业内容</label>
            <textarea id="contentInput" rows="3" placeholder="写作业内容..." required></textarea>
          </div>
          <div class="form-group">
            <label for="deadlineInput">截止时间</label>
            <div class="deadline-row">
              <div class="seg" id="deadlineDaySeg" role="group" aria-label="截止日">
                <button type="button" class="seg-opt active" data-offset="0" aria-pressed="true">当天</button>
                <button type="button" class="seg-opt" data-offset="1" aria-pressed="false">次日</button>
              </div>
              <input type="text" id="deadlineInput" inputmode="numeric" placeholder="如 14:30（可留空）">
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="modalCancel">取消</button>
          <button type="submit" class="btn-submit" id="modalSubmit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 展示态右上角簇：时钟 + 出口。出口和「看时间」是同一角落里两件事——
       前者给人按，必须和后者一样显眼，所以并进同一个容器由 .show-hud 统一定位。 -->
  <div class="show-hud" id="showHud">
    <div class="show-clock" id="showClock">--:--</div>
    <button class="exit-show-btn" id="exitShowBtn">退出展示</button>
  </div>

  <!-- 离线角标（左下角）：刷新连续失败时才出现，恢复后自动消失。
       position:fixed 不参与布局，不会干扰 fitShowDisplay 的字号测量；
       pointer-events:none 保证它绝不挡住任何点击。 -->
  <div class="offline-badge hidden" id="offlineBadge">
    <span class="offline-dot"></span>离线 · 数据可能不是最新
  </div>

  <!-- 展示模式字号调节（右下角） -->
  <div class="show-ctrl hidden" id="showCtrl">
    <div class="show-font" id="showFontCtrl">
      <button id="showFontMinus" title="缩小字号"><span>A−</span></button>
      <span class="show-font-val" id="showFontVal">100%</span>
      <button id="showFontPlus" title="放大字号"><span>A+</span></button>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
